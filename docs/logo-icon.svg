<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="nexusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A3E635" />
      <stop offset="100%" stop-color="#84CC16" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563EB" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="#0B1220" />
  
  <!-- Subtle Grid Pattern in background -->
  <path d="M25 25h50v50H25z" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Geometric Nexus 'N' Icon -->
  <!-- Left Pillar -->
  <rect x="24" y="24" width="14" height="52" rx="7" fill="url(#nexusGrad)" filter="url(#glow)" />
  
  <!-- Diagonal Beam with Node Connection -->
  <path d="M36 28 L64 72 A 7 7 0 0 0 76 68 L76 28 A 7 7 0 0 0 62 28 L62 48 L44 24 A 7 7 0 0 0 36 28 Z" fill="#3B82F6" />

  <!-- Right Pillar -->
  <rect x="62" y="24" width="14" height="52" rx="7" fill="url(#nexusGrad)" />

  <!-- Dynamic Shopping / Deal Pulse Node (Nook Corner) -->
  <circle cx="76" cy="24" r="8" fill="url(#limeGrad)" stroke="#0B1220" stroke-width="3" />
  <circle cx="76" cy="24" r="3.5" fill="#FFFFFF" />
</svg>
