<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="nGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="limeGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A3E635" />
      <stop offset="100%" stop-color="#84CC16" />
    </linearGradient>
  </defs>

  <!-- Icon Section -->
  <g transform="translate(10, 10)">
    <rect width="60" height="60" rx="16" fill="#0B1220" />
    <!-- N Pillar Left -->
    <rect x="14" y="14" width="9" height="32" rx="4.5" fill="url(#nGradH)" />
    <!-- Diagonal -->
    <path d="M22 17 L39 43 A 4.5 4.5 0 0 0 46 41 L46 17 A 4.5 4.5 0 0 0 37 17 L37 29 L27 15 A 4.5 4.5 0 0 0 22 17 Z" fill="#3B82F6" />
    <!-- N Pillar Right -->
    <rect x="37" y="14" width="9" height="32" rx="4.5" fill="url(#nGradH)" />
    <!-- Deal Node -->
    <circle cx="46" cy="14" r="5" fill="url(#limeGradH)" stroke="#0B1220" stroke-width="2" />
  </g>

  <!-- Typography: NEXUS NOOK -->
  <text x="82" y="47" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="800" font-size="28" letter-spacing="-0.5" fill="#0B1220">NEXUS</text>
  <text x="188" y="47" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="600" font-size="28" letter-spacing="-0.5" fill="#2563EB">NOOK</text>
  
  <!-- Tagline underneath -->
  <text x="83" y="63" font-family="'Inter', sans-serif" font-weight="500" font-size="10.5" letter-spacing="1.2" fill="#64748B">DISCOVER MORE • SHOP SMARTER</text>
  
  <!-- Accent Sparkle -->
  <circle cx="274" cy="36" r="3.5" fill="#84CC16" />
</svg>
